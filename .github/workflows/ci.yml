name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Lint workflows and composite actions
        # release.yml is only ever exercised when a tag is cut, so a mistake in
        # it costs a failed release rather than a failed PR. actionlint closes
        # part of that gap here: beyond YAML wellformedness it resolves local
        # `uses: ./.github/actions/...` paths, requires `shell:` on composite
        # run steps, and shellchecks the run blocks — exactly the errors that
        # would otherwise surface at tag time.
        run: |
          ver=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Build UI tarballs (smoke)
        # Mirror what release.yml's build-ui-tarballs job does — runs
        # `yarn install` at the workspace root and then `yarn build`
        # under cxb/ and catalog/. Catches yarn-install / vite-build
        # regressions at PR time instead of at release time, where they
        # have previously only surfaced after a tag was already cut.
        # No untrusted input is interpolated into the run: command — it
        # invokes the checked-in build-ui.sh script with no arguments.
        run: ./build-ui.sh

      - name: Frontend unit tests (catalog + cxb + ui-shared)
        # The vite build above type-checks nothing and runs no assertions, so
        # without this step the frontend suites — including everything covering
        # ui-shared/, which both frontends depend on — would be dead weight
        # that only ever ran on a developer's machine. build-ui.sh has already
        # done the hoisted `yarn install`, so node_modules is populated here.
        #
        # Both are run even if the first fails, so a red build reports every
        # broken suite rather than only the alphabetically luckier one.
        run: |
          rc=0
          yarn --cwd catalog test || rc=1
          yarn --cwd cxb test || rc=1
          exit $rc

      - name: Copy host config
        # Absolute paths throughout — the runner's $HOME is per-instance
        # (/home/githubrunner/runners/rXX/home) under the systemd override
        # that isolates per-runner podman/NuGet state. The host config and
        # the PostgreSQL .pgpass both live in the real githubrunner home.
        env:
          PGPASSFILE: /home/githubrunner/.pgpass
        run: |
          # set -e so a silent dropdb/createdb failure no longer cascades
          # into a polluted-DB test run where the admin password is stale
          # from a prior run and every login 401s. Without this guard, a
          # dangling PG connection from a previous job that wasn't fully
          # cleaned up blocks the drop, the create no-ops against the
          # still-existing DB, and the next run inherits stale state.
          # Fail loud at the drop step instead.
          set -e
          cp /home/githubrunner/config.env ./
          # Ensure the test/smoke phases have everything the settings
          # validator requires. Append-if-missing so we don't clobber
          # a host config that already has stricter values.
          grep -q '^JWT_SECRET' config.env || echo 'JWT_SECRET="ci-test-secret-ci-test-secret-32bytes"' >> config.env
          grep -q '^ADMIN_PASSWORD' config.env || echo 'ADMIN_PASSWORD="dmart"' >> config.env
          grep -q '^DATABASE_HOST' config.env || echo 'DATABASE_HOST="127.0.0.1"' >> config.env
          grep -q '^DATABASE_USERNAME' config.env || echo 'DATABASE_USERNAME="dmart"' >> config.env
          grep -q '^DATABASE_PASSWORD' config.env || echo 'DATABASE_PASSWORD="dmart"' >> config.env
          # Per-runner test database — NOT the host-global "dmart".
          # This host runs several runner instances (r01, r02, …) against ONE
          # PostgreSQL. The reset below drops and recreates the database, so
          # when every job aims at the same name, a job starting on r02 nukes
          # the schema that r01's `dotnet test` is actively using. That
          # surfaced as a sub-second burst of failures in whichever test class
          # happened to be mid-run, with the three SQLSTATEs tracking the
          # three commands below: 57P01 (terminate) → 3D000 (dropped, not yet
          # recreated) → 42P01 (recreated, schema not yet initialized).
          # A runner only ever executes one job at a time, so keying the
          # database on the runner name makes the reset collision-free
          # without serializing CI across runners. Sanitized to [a-z0-9_]
          # (so it is a safe bare SQL identifier no matter what the runner is
          # named) and length-capped under PG's 63-byte identifier limit.
          TEST_DB="dmart_ci_$(printf '%s' "${RUNNER_NAME:-local}" \
            | tr '[:upper:]' '[:lower:]' | tr -c '[:alnum:]' '_' | cut -c1-40)"
          echo "Test database: $TEST_DB"
          # Publish it to the job env so the always() teardown at the end can
          # drop it — the variable itself is local to this step's shell.
          echo "TEST_DB=$TEST_DB" >> "$GITHUB_ENV"
          # Replace rather than append-if-missing: the host config already
          # pins DATABASE_NAME, and appending would leave two keys where the
          # winner depends on parse order rather than on intent.
          sed -i '/^DATABASE_NAME[[:space:]]*=/d' config.env
          echo "DATABASE_NAME=\"$TEST_DB\"" >> config.env
          # Pre-amble: kick any sessions still attached to THIS runner's DB.
          # The dmart server's IHostApplicationLifetime.ApplicationStopped
          # hook now calls NpgsqlConnection.ClearAllPools(), so a graceful
          # SIGTERM shouldn't leave orphan backends — but a hard kill
          # (OOM, runner abort, panic before the lifetime fires) still
          # can, and PG refuses to drop a database with open connections.
          # This kept here as a defensive belt: harmless when there's
          # nothing to terminate, life-saving when the previous run died
          # ungracefully. `|| true` keeps a cold-PG / missing-DB case
          # from blocking; only dropdb is required to succeed.
          psql -w -h 127.0.0.1 -U dmart -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity \
             WHERE datname='$TEST_DB' AND pid <> pg_backend_pid();" \
            >/dev/null || true
          # -w makes these fail fast (no password prompt) if PGPASSFILE miss.
          # Both connect to the `postgres` maintenance DB, so the existing
          # .pgpass entry keeps working — only the target name changed.
          dropdb   -w --if-exists -h 127.0.0.1 -U dmart "$TEST_DB"
          createdb -w             -h 127.0.0.1 -U dmart "$TEST_DB"

      - name: Build
        run: dotnet build dmart.slnx -c Release --nologo

      - name: Unit + integration tests
        # BACKEND_ENV pins the validator-required config for the test host.
        # Without this, Directory.GetCurrentDirectory() during `dotnet test`
        # may resolve to the test project's output dir, making the ./config.env
        # lookup miss the file at the repo root.
        run: BACKEND_ENV=$(pwd)/config.env DMART_TEST_PWD=dmart dotnet test dmart.Tests/dmart.Tests.csproj -c Release --nologo --logger "trx;LogFileName=results.trx"

      # AOT publish lives in release.yml (build-fedora-rpm, build-el9-rpm,
      # build-windows, build-container — all exercise `dotnet publish
      # -p:PublishAot=true` on their respective RIDs). Running it again on
      # every push cost ~3 min per CI run for the smallest of incremental
      # signals: the trim/AOT/single-file analyzers (unconditional errors in
      # dmart.csproj — they run on every build, local and CI) already fire
      # during the regular `dotnet build` step above and catch the
      # analyzer-detectable subset. What's only caught at native-link time
      # (deep trimmer + ILC errors, IlcTreatWarningsAsErrors) is acceptable
      # to defer to release.yml as long as releases keep going out regularly.

      - name: E2E smoke tests (curl.sh)
        run: |
          # Smoke against the JIT apphost from the Build step's output.
          # That binary still exercises every HTTP handler, JSON
          # serializer, and middleware path — what it doesn't exercise
          # is the native-trimmed binary shape, which release.yml covers.
          BUILD_DIR="bin/Release/net10.0"
          # config.env already populated in the "Copy host config" step.
          cp config.env "$BUILD_DIR/"
          # #96: admin-provisioned users are passwordless and authenticate via
          # OTP. The smoke "Limited user" flow logs in with the mock OTP code, so
          # the smoke server must mock email-OTP delivery (code = MOCK_OTP_CODE,
          # default 123456). Scoped to the smoke server's copy only — the unit /
          # integration test step's config is left untouched.
          echo 'MOCK_SMTP_API=true' >> "$BUILD_DIR/config.env"
          # Start server from the build output directory (apphost
          # finds its DLL + deps next to itself). BACKEND_ENV points at
          # the copied-in config.env explicitly — the cwd lookup that
          # used to find it was removed in the DotEnv hardening, so
          # without this flag the server starts with empty config and
          # the smoke tests collapse on missing BASE_URL etc.
          (cd "$BUILD_DIR" && BACKEND_ENV=./config.env ./dmart serve) &
          SERVER_PID=$!
          # Wait for server to come up — try both common ports
          sleep 3
          DMART_PORT=""
          for port in 5099 7979 8080; do
            if curl -sf "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
              DMART_PORT=$port
              break
            fi
          done
          if [ -z "$DMART_PORT" ]; then
            # Longer wait, scan again
            sleep 10
            for port in 5099 7979 8080; do
              if curl -sf "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
                DMART_PORT=$port
                break
              fi
            done
          fi
          echo "Server detected on port: ${DMART_PORT:-NONE}"
          # Use DmartSettings defaults (dmart/dmart) — on a fresh DB the
          # bootstrap creates this admin user automatically.
          DMART_URL="http://127.0.0.1:${DMART_PORT}" DMART_ADMIN=dmart DMART_PWD=dmart ./curl.sh
          CURL_RC=$?
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $CURL_RC

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: dmart.Tests/TestResults/

      - name: Drop the per-runner test database
        # if: always() — the reset at the start of a run only cleans up the
        # database THIS runner will reuse, so a job that is cancelled, times
        # out, or dies after a rename leaves its database on the host forever.
        # Tearing down here bounds that to one database per active runner.
        # Never fails the job: a missing TEST_DB (job died before the config
        # step) or an unreachable PostgreSQL is not a test result.
        if: always()
        env:
          PGPASSFILE: /home/githubrunner/.pgpass
        run: |
          [ -n "$TEST_DB" ] || { echo "no TEST_DB to drop"; exit 0; }
          psql -w -h 127.0.0.1 -U dmart -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity \
             WHERE datname='$TEST_DB' AND pid <> pg_backend_pid();" \
            >/dev/null || true
          dropdb -w --if-exists -h 127.0.0.1 -U dmart "$TEST_DB" || true
