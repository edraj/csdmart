name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build-and-test-matrix:
    runs-on: self-hosted

    # One axis: the SQL backend. Both drivers ship in the same binary and share
    # the same REST surface, so the only way to know a change is safe on both
    # is to run the suite twice against the same commit.
    #
    # The whole job is matrixed rather than just the test step, because a
    # matrix job gets its own workspace and would have to rebuild anyway.
    # Splitting build into a shared job and shipping bin/ between them as an
    # artifact would trade ~3 minutes of compile for an upload and download of
    # the full output tree on a self-hosted runner — not obviously a win, and
    # it couples the jobs. The duplicated cheap prelude (lint, UI build,
    # frontend tests) is ~20s.
    strategy:
      # Never fail-fast. When one driver breaks, the OTHER driver's result is
      # the single most useful fact for triage: it separates "this change is
      # wrong" from "this change is wrong on this backend". Cancelling the
      # sibling throws that away exactly when it is needed.
      fail-fast: false
      matrix:
        driver: [postgresql, sqlite]

    name: build-and-test (${{ matrix.driver }})

    steps:
      - uses: actions/checkout@v6

      - name: Lint workflows and composite actions
        # release.yml is only ever exercised when a tag is cut, so a mistake in
        # it costs a failed release rather than a failed PR. actionlint closes
        # part of that gap here: beyond YAML wellformedness it resolves local
        # `uses: ./.github/actions/...` paths, requires `shell:` on composite
        # run steps, and shellchecks the run blocks — exactly the errors that
        # would otherwise surface at tag time.
        #
        # Cached, retried and checksum-verified, because the naive form failed
        # twice on unrelated PRs. Three separate problems, all fixed here:
        #
        #   * No retry. A single transient CDN error failed a build that had
        #     nothing to do with workflows — once with `curl: (56) Connection
        #     died`, once on a docs-only change.
        #   * No cache. It re-downloaded on every leg of every run; the driver
        #     matrix doubled that, doubling the exposure too.
        #   * `curl | tar`. A truncated download became `gzip: stdin:
        #     unexpected end of file`, which names neither the download nor the
        #     network as the cause. Downloading to a file first turns a partial
        #     transfer into a checksum failure that says so.
        #
        # The checksum is the release's own published value (verified against
        # actionlint_${ver}_checksums.txt). Bumping `ver` means bumping `sha`.
        run: |
          set -euo pipefail
          ver=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          bin="${RUNNER_TOOL_CACHE:-/tmp}/actionlint/${ver}/actionlint"

          if [ ! -x "$bin" ]; then
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            url="https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
            ok=
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/al.tgz" "$url"; then ok=1; break; fi
              echo "actionlint download attempt ${attempt}/3 failed"
              sleep $((attempt * 5))
            done
            [ -n "$ok" ] || { echo "could not download actionlint after 3 attempts"; exit 1; }

            echo "${sha}  ${tmp}/al.tgz" | sha256sum -c - \
              || { echo "actionlint checksum mismatch — refusing to run it"; exit 1; }

            tar -xzf "$tmp/al.tgz" -C "$tmp" actionlint
            mkdir -p "$(dirname "$bin")"
            # Same-filesystem mv, so a concurrent runner either sees the old
            # absence or the complete binary, never a half-written one.
            mv -f "$tmp/actionlint" "$bin"
          fi

          "$bin" -color

      - name: Build UI tarballs (smoke)
        # Mirror what release.yml's build-ui-tarballs job does — runs
        # `yarn install` at the workspace root and then `yarn build`
        # under cxb/ and catalog/. Catches yarn-install / vite-build
        # regressions at PR time instead of at release time, where they
        # have previously only surfaced after a tag was already cut.
        # No untrusted input is interpolated into the run: command — it
        # invokes the checked-in build-ui.sh script with no arguments.
        run: ./build-ui.sh

      - name: Frontend unit tests (catalog + cxb + ui-shared)
        # The vite build above type-checks nothing and runs no assertions, so
        # without this step the frontend suites — including everything covering
        # ui-shared/, which both frontends depend on — would be dead weight
        # that only ever ran on a developer's machine. build-ui.sh has already
        # done the hoisted `yarn install`, so node_modules is populated here.
        #
        # Both are run even if the first fails, so a red build reports every
        # broken suite rather than only the alphabetically luckier one.
        run: |
          rc=0
          yarn --cwd catalog test || rc=1
          yarn --cwd cxb test || rc=1
          exit $rc

      - name: Copy host config (PostgreSQL)
        if: matrix.driver == 'postgresql'
        # Absolute paths throughout — the runner's $HOME is per-instance
        # (/home/githubrunner/runners/rXX/home) under the systemd override
        # that isolates per-runner podman/NuGet state. The host config and
        # the PostgreSQL .pgpass both live in the real githubrunner home.
        env:
          PGPASSFILE: /home/githubrunner/.pgpass
        run: |
          # set -e so a silent dropdb/createdb failure no longer cascades
          # into a polluted-DB test run where the admin password is stale
          # from a prior run and every login 401s. Without this guard, a
          # dangling PG connection from a previous job that wasn't fully
          # cleaned up blocks the drop, the create no-ops against the
          # still-existing DB, and the next run inherits stale state.
          # Fail loud at the drop step instead.
          set -e
          cp /home/githubrunner/config.env ./
          # Ensure the test/smoke phases have everything the settings
          # validator requires. Append-if-missing so we don't clobber
          # a host config that already has stricter values.
          grep -q '^JWT_SECRET' config.env || echo 'JWT_SECRET="ci-test-secret-ci-test-secret-32bytes"' >> config.env
          grep -q '^ADMIN_PASSWORD' config.env || echo 'ADMIN_PASSWORD="dmart"' >> config.env
          grep -q '^DATABASE_HOST' config.env || echo 'DATABASE_HOST="127.0.0.1"' >> config.env
          grep -q '^DATABASE_USERNAME' config.env || echo 'DATABASE_USERNAME="dmart"' >> config.env
          grep -q '^DATABASE_PASSWORD' config.env || echo 'DATABASE_PASSWORD="dmart"' >> config.env
          # Per-runner test database — NOT the host-global "dmart".
          # This host runs several runner instances (r01, r02, …) against ONE
          # PostgreSQL. The reset below drops and recreates the database, so
          # when every job aims at the same name, a job starting on r02 nukes
          # the schema that r01's `dotnet test` is actively using. That
          # surfaced as a sub-second burst of failures in whichever test class
          # happened to be mid-run, with the three SQLSTATEs tracking the
          # three commands below: 57P01 (terminate) → 3D000 (dropped, not yet
          # recreated) → 42P01 (recreated, schema not yet initialized).
          # A runner only ever executes one job at a time, so keying the
          # database on the runner name makes the reset collision-free
          # without serializing CI across runners. Sanitized to [a-z0-9_]
          # (so it is a safe bare SQL identifier no matter what the runner is
          # named) and length-capped under PG's 63-byte identifier limit.
          TEST_DB="dmart_ci_$(printf '%s' "${RUNNER_NAME:-local}" \
            | tr '[:upper:]' '[:lower:]' | tr -c '[:alnum:]' '_' | cut -c1-40)"
          echo "Test database: $TEST_DB"
          # Publish it to the job env so the always() teardown at the end can
          # drop it — the variable itself is local to this step's shell.
          echo "TEST_DB=$TEST_DB" >> "$GITHUB_ENV"
          # Replace rather than append-if-missing: the host config already
          # pins DATABASE_NAME, and appending would leave two keys where the
          # winner depends on parse order rather than on intent.
          sed -i '/^DATABASE_NAME[[:space:]]*=/d' config.env
          echo "DATABASE_NAME=\"$TEST_DB\"" >> config.env
          # Pre-amble: kick any sessions still attached to THIS runner's DB.
          # The dmart server's IHostApplicationLifetime.ApplicationStopped
          # hook now calls NpgsqlConnection.ClearAllPools(), so a graceful
          # SIGTERM shouldn't leave orphan backends — but a hard kill
          # (OOM, runner abort, panic before the lifetime fires) still
          # can, and PG refuses to drop a database with open connections.
          # This kept here as a defensive belt: harmless when there's
          # nothing to terminate, life-saving when the previous run died
          # ungracefully. `|| true` keeps a cold-PG / missing-DB case
          # from blocking; only dropdb is required to succeed.
          psql -w -h 127.0.0.1 -U dmart -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity \
             WHERE datname='$TEST_DB' AND pid <> pg_backend_pid();" \
            >/dev/null || true
          # -w makes these fail fast (no password prompt) if PGPASSFILE miss.
          # Both connect to the `postgres` maintenance DB, so the existing
          # .pgpass entry keeps working — only the target name changed.
          dropdb   -w --if-exists -h 127.0.0.1 -U dmart "$TEST_DB"
          createdb -w             -h 127.0.0.1 -U dmart "$TEST_DB"
          # Per-runner smoke port. The runners share ONE host and one network
          # stack, so two jobs that both bind the config's LISTENING_PORT
          # cannot coexist — and the smoke step used to DISCOVER its server by
          # scanning fixed ports, which meant the loser of that race happily
          # found the OTHER job's server and ran the whole suite against the
          # wrong database. That surfaced as "entry exists" and duplicate-key
          # errors on same-second fixture names. Harmless while one job ran per
          # push; the driver matrix made three.
          #
          # Keyed on the runner for the same reason the test database is: a
          # runner executes one job at a time, so a per-runner port is
          # collision-free by construction without serializing CI.
          # 10# forces base 10: a runner named r08 yields "08", which the
          # shell would otherwise read as octal and reject. :-0 covers a
          # runner whose name has no digits at all.
          RUNNER_DIGITS=$(printf '%s' "${RUNNER_NAME:-local}" | tr -cd '0-9' | tail -c 3)
          SMOKE_PORT=$(( 5100 + 10#${RUNNER_DIGITS:-0} % 100 ))
          echo "SMOKE_PORT=$SMOKE_PORT" >> "$GITHUB_ENV"
          sed -i '/^LISTENING_PORT[[:space:]]*=/d' config.env
          echo "LISTENING_PORT=$SMOKE_PORT" >> config.env
          echo "Smoke port: $SMOKE_PORT"

      - name: Write SQLite config
        if: matrix.driver == 'sqlite'
        # No host database to reset, no per-runner name to derive, no teardown:
        # the store is one file inside this job's workspace, which the runner
        # discards. That is most of the point of the tier.
        run: |
          set -e
          cp /home/githubrunner/config.env ./
          # Drop every PostgreSQL key rather than leaving them alongside
          # DATABASE_DRIVER="sqlite". They would be inert, but a config that
          # still names a host and database is a config someone will later read
          # as "this talks to PostgreSQL" — and if the driver line is ever lost
          # in a merge, the job would silently go back to hitting the shared
          # host database instead of failing.
          # SPACES_FOLDER is stripped alongside the PostgreSQL keys for the
          # same reason the PostgreSQL step replaces DATABASE_NAME rather than
          # appending it: leaving the host's value in place and adding ours
          # below would leave two keys, and which one wins would depend on
          # parse order rather than on intent.
          sed -i -E '/^(DATABASE_(DRIVER|HOST|PORT|USERNAME|PASSWORD|NAME)|POSTGRES_CONNECTION|SPACES_FOLDER)[[:space:]]*=/d' config.env
          {
            echo 'DATABASE_DRIVER="sqlite"'
            echo "SQLITE_PATH=\"$(pwd)/ci-smoke.db\""
            # Workspace-local spaces folder. The host config points at a shared
            # one, and with two matrix jobs now running per push, two servers
            # writing the same flat files would race. Empty is fine: the admin
            # bootstrap creates the management space on first boot, which is
            # exactly the cold-start path worth exercising.
            echo "SPACES_FOLDER=\"$(pwd)/ci-spaces\""
          } >> config.env
          mkdir -p ci-spaces
          grep -q '^JWT_SECRET' config.env || echo 'JWT_SECRET="ci-test-secret-ci-test-secret-32bytes"' >> config.env
          grep -q '^ADMIN_PASSWORD' config.env || echo 'ADMIN_PASSWORD="dmart"' >> config.env
          # Per-runner smoke port. The runners share ONE host and one network
          # stack, so two jobs that both bind the config's LISTENING_PORT
          # cannot coexist — and the smoke step used to DISCOVER its server by
          # scanning fixed ports, which meant the loser of that race happily
          # found the OTHER job's server and ran the whole suite against the
          # wrong database. That surfaced as "entry exists" and duplicate-key
          # errors on same-second fixture names. Harmless while one job ran per
          # push; the driver matrix made three.
          #
          # Keyed on the runner for the same reason the test database is: a
          # runner executes one job at a time, so a per-runner port is
          # collision-free by construction without serializing CI.
          # 10# forces base 10: a runner named r08 yields "08", which the
          # shell would otherwise read as octal and reject. :-0 covers a
          # runner whose name has no digits at all.
          RUNNER_DIGITS=$(printf '%s' "${RUNNER_NAME:-local}" | tr -cd '0-9' | tail -c 3)
          SMOKE_PORT=$(( 5100 + 10#${RUNNER_DIGITS:-0} % 100 ))
          echo "SMOKE_PORT=$SMOKE_PORT" >> "$GITHUB_ENV"
          sed -i '/^LISTENING_PORT[[:space:]]*=/d' config.env
          echo "LISTENING_PORT=$SMOKE_PORT" >> config.env
          echo "Smoke port: $SMOKE_PORT"

      - name: Build
        run: dotnet build dmart.slnx -c Release --nologo

      - name: Unit + integration tests
        # BACKEND_ENV pins the validator-required config for the test host.
        # Without this, Directory.GetCurrentDirectory() during `dotnet test`
        # may resolve to the test project's output dir, making the ./config.env
        # lookup miss the file at the repo root.
        #
        # DMART_TEST_DRIVER is what DmartFactory reads to point every test host
        # at SQLite (it overrides the config in-memory and nulls the PostgreSQL
        # settings, so nothing can silently fall back). Empty for the
        # PostgreSQL leg, which keeps that command byte-identical to before.
        env:
          DMART_TEST_DRIVER: ${{ matrix.driver == 'sqlite' && 'sqlite' || '' }}
        run: BACKEND_ENV=$(pwd)/config.env DMART_TEST_PWD=dmart dotnet test dmart.Tests/dmart.Tests.csproj -c Release --nologo --logger "trx;LogFileName=results.trx"

      # AOT publish is no longer deferred to release.yml — see the aot-publish
      # job at the bottom of this file for why the tradeoff changed.

      - name: E2E smoke tests (curl.sh)
        run: |
          # Smoke against the JIT apphost from the Build step's output.
          # That binary still exercises every HTTP handler, JSON
          # serializer, and middleware path — what it doesn't exercise
          # is the native-trimmed binary shape, which release.yml covers.
          BUILD_DIR="bin/Release/net10.0"
          # config.env already populated by whichever of the two config
          # steps this matrix leg ran.
          cp config.env "$BUILD_DIR/"
          # #96: admin-provisioned users are passwordless and authenticate via
          # OTP. The smoke "Limited user" flow logs in with the mock OTP code, so
          # the smoke server must mock email-OTP delivery (code = MOCK_OTP_CODE,
          # default 123456). Scoped to the smoke server's copy only — the unit /
          # integration test step's config is left untouched.
          echo 'MOCK_SMTP_API=true' >> "$BUILD_DIR/config.env"
          # Start server from the build output directory (apphost
          # finds its DLL + deps next to itself). BACKEND_ENV points at
          # the copied-in config.env explicitly — the cwd lookup that
          # used to find it was removed in the DotEnv hardening, so
          # without this flag the server starts with empty config and
          # the smoke tests collapse on missing BASE_URL etc.
          (cd "$BUILD_DIR" && BACKEND_ENV=./config.env ./dmart serve) &
          SERVER_PID=$!
          # Wait on the port THIS job's server was configured with. Never
          # scan: a scan cannot tell "my server is slow to start" from "my
          # server failed to bind and I am now talking to somebody else's".
          DMART_PORT="$SMOKE_PORT"
          for _ in $(seq 1 40); do
            curl -sf "http://127.0.0.1:${DMART_PORT}/" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf "http://127.0.0.1:${DMART_PORT}/" >/dev/null 2>&1; then
            echo "server never came up on ${DMART_PORT}"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "Server on port: ${DMART_PORT}"
          # Use DmartSettings defaults (dmart/dmart) — on a fresh DB the
          # bootstrap creates this admin user automatically.
          DMART_URL="http://127.0.0.1:${DMART_PORT}" DMART_ADMIN=dmart DMART_PWD=dmart ./curl.sh
          CURL_RC=$?
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $CURL_RC

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per-driver name: upload-artifact rejects a duplicate name, so a
          # shared one would fail the second leg to finish.
          name: test-results-${{ matrix.driver }}
          path: dmart.Tests/TestResults/

      - name: Drop the per-runner test database
        # if: always() — the reset at the start of a run only cleans up the
        # database THIS runner will reuse, so a job that is cancelled, times
        # out, or dies after a rename leaves its database on the host forever.
        # Tearing down here bounds that to one database per active runner.
        # Never fails the job: a missing TEST_DB (job died before the config
        # step) or an unreachable PostgreSQL is not a test result.
        if: always() && matrix.driver == 'postgresql'
        env:
          PGPASSFILE: /home/githubrunner/.pgpass
        run: |
          [ -n "$TEST_DB" ] || { echo "no TEST_DB to drop"; exit 0; }
          psql -w -h 127.0.0.1 -U dmart -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity \
             WHERE datname='$TEST_DB' AND pid <> pg_backend_pid();" \
            >/dev/null || true
          dropdb -w --if-exists -h 127.0.0.1 -U dmart "$TEST_DB" || true

  # The branch ruleset on master requires a status check named exactly
  # `build-and-test`. Matrixing that job renamed it to
  # `build-and-test (postgresql)` / `build-and-test (sqlite)`, so the required
  # check stopped being produced at all — which blocks not just this PR but
  # EVERY future one, on a check that can never appear.
  #
  # This job restores the name as an aggregate. It runs no build of its own; it
  # simply fails when any matrix leg failed or was cancelled, so the gate keeps
  # meaning what it meant. Adding a third driver later needs no ruleset edit.
  #
  # needs: + an explicit result check, because `needs:` alone would let this job
  # be SKIPPED when a dependency fails — and a skipped required check reads as
  # "not failed" to some gates, which is exactly the silent pass to avoid.
  build-and-test:
    name: build-and-test
    runs-on: self-hosted
    needs: [build-and-test-matrix]
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "matrix result: ${{ needs.build-and-test-matrix.result }}"
          [ "${{ needs.build-and-test-matrix.result }}" = "success" ] || {
            echo "one or more driver legs did not succeed"
            exit 1
          }

  aot-publish:
    runs-on: self-hosted
    # Independent of build-and-test: a native-link failure and a test failure
    # are different diagnoses, and there is no reason to make one wait on the
    # other.

    steps:
      - uses: actions/checkout@v6

      - name: Native AOT publish
        # This used to live only in release.yml, deliberately — the reasoning
        # was that the trim/AOT analyzers are unconditional errors in
        # dmart.csproj and already fire during the ordinary `dotnet build`, so
        # paying ~3 min per push to re-catch the analyzer-detectable subset was
        # a poor trade, and native-link-only failures could wait for the next
        # tag.
        #
        # Adding SQLite changed that. Microsoft.Data.Sqlite reaches its engine
        # through SQLitePCLRaw, which resolves a NATIVE library at runtime via
        # dlopen — a shape the analyzers cannot see and the ordinary build
        # cannot exercise. A failure there is invisible until a native binary
        # actually opens a database, so deferring it to tag time means finding
        # it after a release is already cut.
        #
        # IlcTreatWarningsAsErrors is set in dmart.csproj, so any new IL2026 /
        # IL2027 / IL3050 fails this step rather than being printed and passed.
        run: dotnet publish dmart.csproj -r linux-x64 -c Release -p:PublishAot=true --nologo

      - name: Smoke the native binary on SQLite
        # The point of the job. The publish above proves it LINKS; this proves
        # the linked binary can actually load libe_sqlite3.so and serve — which
        # is the specific failure mode AOT introduces here and the only one the
        # JIT smoke above cannot see. SQLite rather than PostgreSQL because
        # SQLite is the driver with the native dependency, and because it needs
        # no host database.
        run: |
          set -e
          PUB="bin/Release/net10.0/linux-x64/publish"
          test -f "$PUB/libe_sqlite3.so" \
            || { echo "libe_sqlite3.so missing from the publish output"; exit 1; }
          mkdir -p "$PUB/aot-spaces"
          # Same per-runner keying as the matrix legs — this job runs
          # concurrently with them on the same host.
          RUNNER_DIGITS=$(printf '%s' "${RUNNER_NAME:-local}" | tr -cd '0-9' | tail -c 3)
          AOT_PORT=$(( 5200 + 10#${RUNNER_DIGITS:-0} % 100 ))
          echo "AOT smoke port: $AOT_PORT"
          # Written with echo rather than a heredoc: the body of a heredoc
          # inside an indented `run: |` block keeps its leading spaces, and its
          # terminator has to sit at column 0 to match at all.
          {
            echo 'DATABASE_DRIVER="sqlite"'
            echo "SQLITE_PATH=\"$(pwd)/$PUB/aot.db\""
            echo "SPACES_FOLDER=\"$(pwd)/$PUB/aot-spaces\""
            echo "LISTENING_PORT=$AOT_PORT"
            echo 'JWT_SECRET="ci-test-secret-ci-test-secret-32bytes"'
            echo 'ADMIN_PASSWORD="dmart"'
            echo 'MOCK_SMTP_API=true'
          } > "$PUB/config.env"
          (cd "$PUB" && BACKEND_ENV=./config.env ./dmart serve) &
          SERVER_PID=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:${AOT_PORT}/health/ready >/dev/null 2>&1 && break
            sleep 1
          done
          # /health/ready is not a formality here: it runs SELECT 1 through the
          # configured factory, so a 200 already means the native SQLite
          # library loaded and answered a query.
          curl -sf http://127.0.0.1:${AOT_PORT}/health/ready >/dev/null \
            || { echo "native binary did not become ready"; kill $SERVER_PID 2>/dev/null; exit 1; }
          # Guarded by `if` rather than trailing `$?`: `set -e` is on for this
          # step, so a bare failing command would abort before the kill below
          # and leave the server running on the runner.
          CURL_RC=0
          if ! DMART_URL="http://127.0.0.1:${AOT_PORT}" DMART_ADMIN=dmart DMART_PWD=dmart ./curl.sh; then
            CURL_RC=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $CURL_RC

      - name: Backup/restore round trip (native binary)
        # Everything this covers was verified by hand once and could regress
        # silently: that BOTH export formats survive a full cycle, that
        # attachment MEDIA BYTES survive it, and that a full Parquet backup
        # restores into a genuinely empty system.
        #
        # It restores into FRESH databases rather than wiping and re-importing,
        # because that is the actual disaster-recovery shape — and it needs no
        # SQL access, so it runs on SQLite with no service container.
        #
        # Ports are keyed per runner like the smoke above: this job runs
        # concurrently with the matrix legs on the same host. The base is kept
        # clear of 5432, which the script's third port would otherwise hit.
        run: |
          RUNNER_DIGITS=$(printf '%s' "${RUNNER_NAME:-local}" | tr -cd '0-9' | tail -c 3)
          RT_PORT=$(( 5600 + (10#${RUNNER_DIGITS:-0} % 50) * 4 ))
          echo "round-trip base port: $RT_PORT"
          ./.github/scripts/backup-round-trip.sh bin/Release/net10.0/linux-x64/publish "$RT_PORT"

  rpm-build:
    name: RPM build
    runs-on: self-hosted
    # Packaging was only ever built by release.yml, so a broken spec could sit
    # on master for a whole release cycle and fail at tag time — which is
    # exactly what happened to v1.2.0: TWO bugs shipped together (a %files line
    # stranded in %install, and libe_sqlite3.so never staged into the source
    # tarball), and both RPM jobs of the release failed.
    #
    # A parse check would NOT have caught either: `rpmspec -P` reports the spec
    # as valid, because the stray line only fails when the shell EXECUTES
    # %install, and the missing library only fails at %files time. Catching
    # this class needs a real rpmbuild, so that is what this does.
    #
    # Both targets. Fedora builds natively; EL9 builds inside a podman container
    # against the same spec and the same staging step.
    #
    # EL9 is NOT redundant even though both v1.2.0 bugs reproduce on Fedora. The
    # EL9 leg is the one that exercises the container path — a stale or broken
    # builder image, a podman-storage problem, or an EL9-only packaging
    # difference reaches a tag otherwise, and that is precisely the class of
    # failure this job exists to move off the release.
    steps:
      - uses: actions/checkout@v6

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      - name: Build the Fedora RPM
        # VERSION is pinned rather than derived. checkout@v6 fetches depth 1, so
        # `git describe` has no tags to read and build-rpm.sh would silently
        # fall back to 0.1.0 — a version this job would then appear to have
        # chosen. This job validates that the packaging BUILDS; the version it
        # carries is irrelevant, so say so instead of depending on tag depth.
        run: VERSION=0.0.0 ./dist/build-rpm.sh

      - name: Build the EL9 RPM
        # Same script, container path. `podman rm -f` first for the same reason
        # release.yml does it: build-rpm.sh KEEPS the builder container between
        # runs to avoid reinstalling the SDK, and a container left half-built by
        # an interrupted run would otherwise be reused.
        run: |
          podman rm -f dmart-el9-builder 2>/dev/null || true
          VERSION=0.0.0 ./dist/build-rpm.sh el9

      - name: Assert the RPM carries what it must
        # The build succeeding is not the whole property. %files lists
        # libe_sqlite3.so unconditionally and on purpose — a package missing it
        # silently loses the SQLite driver — so check the payload, not just the
        # exit code.
        run: |
          set -e
          for tag in fc el9; do
            RPM=$(ls dist/out/*."$tag"*.x86_64.rpm 2>/dev/null | grep -v '\.src\.rpm$' | head -1)
            test -n "$RPM" || { echo "no $tag RPM produced"; ls -la dist/out || true; exit 1; }
            echo "checking: $RPM"
            for f in /usr/bin/dmart /usr/lib64/libe_sqlite3.so \
                     /usr/share/dmart/config.env.packaged \
                     /usr/share/dmart/config.env.sample; do
              rpm -qlp "$RPM" | grep -qx "$f" \
                || { echo "MISSING from $RPM: $f"; rpm -qlp "$RPM"; exit 1; }
            done
          done
          echo "payload OK for both targets"

  container-build:
    name: Container build
    runs-on: self-hosted
    # The container image was only ever built by release.yml, so a broken
    # Dockerfile, entrypoint or APK layout reached a tag before anyone saw it —
    # the same gap that let two RPM bugs ship in v1.2.0.
    #
    # It matters more since the image stopped compiling dmart and started
    # INSTALLING the .apk: the build step no longer proves the binary works, it
    # only proves a package extracted. So this job serves the image and waits
    # for /health/ready rather than trusting a successful build.
    steps:
      # Full history so the packaging-scope diff below has a base to compare
      # against; checkout's default depth of 1 has none.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # This job is a fifth against three self-hosted runners, so it does not
      # run on every PR. It runs when the change could plausibly break the
      # IMAGE — packaging inputs — and unconditionally on pushes to master, so
      # every merge still validates the container even if the PR that caused it
      # touched only C#.
      #
      # WHAT THIS TRADES AWAY, stated rather than discovered later: a pure C#
      # change that breaks the container only under MUSL would now be caught at
      # the master push rather than on the PR. aot-publish already smoke-tests
      # the glibc native binary on SQLite, so the uncovered case is
      # musl-specific runtime breakage on a feature branch — one merge late,
      # not one release late, which is the gap this job exists to close.
      - name: Is this change in packaging scope?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push to master — running unconditionally"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # No usable base to diff against: run rather than skip. A filter
            # that fails open on uncertainty costs runner time; one that fails
            # closed silently stops testing.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no usable base sha — running to be safe"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '^(admin_scripts/docker/|dist/build-apk\.sh|dist/apk/|dist/dmart\.(service|bash|fish)|build-ui\.sh|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "packaging inputs changed — running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no packaging inputs changed — skipping the image build"
          fi

      - name: Podman preflight (self-heal stale state after host reboot)
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/podman-preflight

      - name: Build the Alpine package
        if: steps.scope.outputs.run == 'true' 
        # build-apk.sh builds the UI itself when cxb/catalog dists are absent,
        # so this is self-contained. VERSION is pinned for the same reason the
        # RPM job pins it: checkout@v6 is depth 1, so `git describe` has no tags
        # and the script would quietly fall back to 0.1.0.
        run: VERSION=0.0.0 ./dist/build-apk.sh --arch x86_64

      - name: Build the container image from it
        if: steps.scope.outputs.run == 'true'
        run: |
          podman build -t dmart-ci:test \
            -f admin_scripts/docker/Dockerfile \
            --build-arg DMART_VERSION=0.0.0 .

      - name: Serve from the image and wait for readiness
        if: steps.scope.outputs.run == 'true' 
        # The property under test. `podman build` succeeding says the apk
        # extracted; it says nothing about whether the binary in it runs, finds
        # libe_sqlite3.so, or can open a database.
        run: |
          set -e
          podman run --rm dmart-ci:test dmart --version
          # Per-runner port: this job runs concurrently with the test matrix on
          # the same host, same keying as the other jobs use.
          RUNNER_DIGITS=$(printf '%s' "${RUNNER_NAME:-local}" | tr -cd '0-9' | tail -c 3)
          PORT=$(( 18200 + 10#${RUNNER_DIGITS:-0} % 50 ))
          echo "container smoke port: $PORT"
          podman rm -f dmart-cismoke 2>/dev/null || true
          podman run -d --name dmart-cismoke -p "$PORT":8000 dmart-ci:test
          ready=0
          for _ in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:$PORT/health/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "--- container never became ready; logs follow ---"
            podman logs dmart-cismoke 2>&1 | tail -40
            podman rm -f dmart-cismoke 2>/dev/null || true
            exit 1
          fi
          # The SPAs ship inside the APK now rather than being copied in, so a
          # packaging change that drops them would otherwise pass unnoticed.
          curl -sf -o /dev/null "http://127.0.0.1:$PORT/cxb/" \
            || { echo "cxb SPA not served"; podman rm -f dmart-cismoke; exit 1; }
          podman rm -f dmart-cismoke 2>/dev/null || true
          echo "image serves, and carries the SPAs"

      - name: Clean up the test image
        if: always()
        run: podman rmi -f dmart-ci:test 2>/dev/null || true

  static-build:
    name: Static musl binary
    runs-on: self-hosted
    # The fully static binary (docs/static-binary.md) is the one artifact with
    # NO runtime dependencies — no libc, no OpenSSL, no libe_sqlite3.so — so it
    # runs on any x86-64 Linux regardless of distro or glibc version.
    #
    # It is also the artifact most easily broken by an unrelated change. Both
    # native dependencies are bound at LINK time (StaticOpenSslLinking for the
    # crypto shim, DirectPInvoke + a static archive for SQLite) precisely
    # because a musl static-pie has no working dlopen. Add one NuGet package
    # that reaches its native library through dlopen and this binary starts
    # failing at runtime while every other job stays green — the ordinary
    # publish and the analyzers cannot see it, exactly as the aot-publish job
    # comment describes for SQLite.
    steps:
      # Full history so the scope diff below has a base to compare against.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A sixth job against three runners, so it does not run on every PR. It
      # runs when the change could plausibly break the STATIC LINK — the
      # project files that carry PackageReferences and the linking block — and
      # unconditionally on pushes to master, so every merge still validates it.
      #
      # WHAT THIS TRADES AWAY: a change that adds a dlopen-ing dependency
      # WITHOUT touching a .csproj cannot exist (PackageReferences live there),
      # but a source change that starts CALLING an existing dlopen path would
      # be caught at the master push rather than on the PR. One merge late, not
      # one release late.
      - name: Is this change in static-link scope?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push to master — running unconditionally"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # Fail open on uncertainty, same as the container job: a filter
            # that silently stops testing is worse than one that costs time.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no usable base sha — running to be safe"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE '(\.csproj|^Directory\.Build\.|^\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "project or linking inputs changed — running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no project files changed — skipping the static build"
          fi

      - name: Podman preflight (self-heal stale state after host reboot)
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/podman-preflight

      - name: Publish the static musl binary
        if: steps.scope.outputs.run == 'true'
        # Alpine because musl is the point: glibc cannot produce a working
        # static-pie for a .NET app. Run as container ROOT — passing
        # --userns=keep-id makes apk fail on its own log file, and rootless
        # podman already maps container root to the runner user, so the
        # artifacts come out owned correctly either way.
        #
        # The NuGet cache is mounted rather than restored fresh: a cold restore
        # costs minutes on every run of a job that is already the longest in
        # this workflow.
        run: |
          set -e
          mkdir -p "$HOME/.nuget/packages"
          podman run --rm \
            -v "$PWD":/src:z \
            -v "$HOME/.nuget/packages":/nuget:z \
            -e NUGET_PACKAGES=/nuget \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c '
              set -e
              apk add --no-cache clang lld build-base cmake zlib-static \
                                 openssl-dev openssl-libs-static \
                                 sqlite-dev sqlite-static
              dotnet publish dmart.csproj -r linux-musl-x64 -c Release \
                -p:PublishAot=true \
                -p:StaticExecutable=true \
                -p:StaticOpenSslLinking=true \
                --nologo'

      - name: Assert it is genuinely standalone
        if: steps.scope.outputs.run == 'true'
        # The regression this job exists to catch. A binary that still links
        # something dynamically, or still carries a dlopen target string, has
        # lost the only property that makes it worth building — and it would
        # otherwise publish and smoke-test perfectly well ON THIS RUNNER, whose
        # distro happens to have the libraries.
        run: |
          set -e
          BIN="bin/Release/net10.0/linux-musl-x64/publish/dmart"
          test -f "$BIN" || { echo "static binary was not produced"; exit 1; }
          file "$BIN"
          NEEDED=$(readelf -d "$BIN" 2>/dev/null | grep -c NEEDED || true)
          if [ "$NEEDED" != "0" ]; then
            echo "FAIL: binary has $NEEDED dynamic dependencies, expected 0"
            readelf -d "$BIN" | grep NEEDED
            exit 1
          fi
          DLOPEN=$(strings -a "$BIN" | grep -cE 'libe_sqlite3|libssl\.so|libcrypto\.so' || true)
          if [ "$DLOPEN" != "0" ]; then
            echo "FAIL: $DLOPEN dlopen target strings remain — something is still resolved at runtime"
            strings -a "$BIN" | grep -E 'libe_sqlite3|libssl\.so|libcrypto\.so' | sort -u
            exit 1
          fi
          echo "static-pie, 0 NEEDED, no dlopen targets"

      - name: Smoke it on SQLite
        if: steps.scope.outputs.run == 'true'
        # Linking proves the symbols resolved; this proves the linked SQLite
        # actually opens a database and executes DDL, which is the failure mode
        # the dlopen-to-link change was made to fix. SQLite rather than
        # PostgreSQL for the same reason aot-publish chose it: it is the driver
        # with the native dependency and it needs no host database.
        #
        # Deliberately NOT run on the runner's own distro assumptions — the
        # binary is musl-linked and static, so it runs here precisely because
        # it depends on nothing.
        run: |
          set -e
          BIN="$PWD/bin/Release/net10.0/linux-musl-x64/publish/dmart"
          WORK=$(mktemp -d)
          {
            echo 'DATABASE_DRIVER="sqlite"'
            echo "SQLITE_PATH=\"$WORK/static.db\""
            echo 'JWT_SECRET="ci-test-secret-ci-test-secret-32bytes"'
          } > "$WORK/config.env"
          chmod 600 "$WORK/config.env"
          BACKEND_ENV="$WORK/config.env" "$BIN" migrate
          test -s "$WORK/static.db" \
            || { echo "migrate reported success but wrote no database"; rm -rf "$WORK"; exit 1; }
          echo "static binary migrated a SQLite database: $(stat -c%s "$WORK/static.db") bytes"
          rm -rf "$WORK"
