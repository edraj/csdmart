# Publishes the AlmaLinux 9 + .NET SDK image that release-verifiable.yml's
# glibc legs build inside. See .github/builder/Containerfile.el9 for why it
# exists.
#
# Deliberately NOT run on every push: the image changes only when its
# Containerfile does, and rebuilding it on unrelated commits would churn a
# digest that release-verifiable.yml pins. Dispatch it, or let the path filter
# fire, then pin the digest it prints.
name: Builder image (el9)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/builder/Containerfile.el9'
      - '.github/workflows/builder-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push dmart-el9-builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dmart-el9-builder:latest \
            -f .github/builder/Containerfile.el9 .

      - name: Push and report the digest to pin
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository_owner }}/dmart-el9-builder
          docker push "$IMG:latest"
          # The digest is the point of this job. release-verifiable.yml pins by
          # digest, not by :latest — a moving tag in the path that produces
          # signed artifacts would mean the toolchain could change under a
          # release without anything recording it.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG:latest" | cut -d@ -f2)
          echo "digest: $DIGEST"
          {
            echo "### Builder image published"
            echo ""
            echo 'Pin this in `release-verifiable.yml`:'
            echo ""
            echo '```'
            echo "image: $IMG@$DIGEST"
            echo '```'
            echo ""
            echo "SDK: $(docker run --rm "$IMG:latest" cat /etc/dmart-builder-sdk-version)"
          } >> "$GITHUB_STEP_SUMMARY"
