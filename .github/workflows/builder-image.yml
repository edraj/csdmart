# Publishes the AlmaLinux 9 + .NET SDK image that release-verifiable.yml's
# glibc legs build inside. See .github/builder/Containerfile.el9 for why it
# exists.
#
# Deliberately NOT run on every push: the image changes only when its
# Containerfile does, and rebuilding it on unrelated commits would churn a
# digest that release-verifiable.yml pins. Dispatch it, or let the path filter
# fire, then pin the digest it prints.
name: Builder image (el9)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/builder/Containerfile.el9'
      - '.github/workflows/builder-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  # One job per architecture on a native runner, then a manifest list — the
  # same shape release.yml uses for the application image, and for the same
  # reason: `dnf install` has to execute binaries of the target architecture,
  # so emulation would mean running the whole install under qemu.
  #
  # This started as a single amd64 build. release-verifiable.yml consumes it
  # from BOTH ubuntu-24.04 and ubuntu-24.04-arm, so the arm64 leg died with
  # "exec /usr/bin/bash: exec format error" the first time it was pinned. A
  # single-arch image with multi-arch consumers fails at run time, not at
  # publish time, which is why it reached a dry run before showing up.
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the per-arch tag
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository_owner }}/dmart-el9-builder
          docker build -t "$IMG:latest-${{ matrix.arch }}" -f .github/builder/Containerfile.el9 .
          docker push "$IMG:latest-${{ matrix.arch }}"
          echo "SDK: $(docker run --rm "$IMG:latest-${{ matrix.arch }}" cat /etc/dmart-builder-sdk-version)"

  manifest:
    name: Manifest + digest to pin
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble, push, and report the digest
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository_owner }}/dmart-el9-builder
          docker manifest rm "$IMG:latest" 2>/dev/null || true
          docker manifest create "$IMG:latest" "$IMG:latest-amd64" "$IMG:latest-arm64"
          # Both architectures must actually be in the index. Pinning an index
          # that carries only one is exactly the failure this job exists to
          # prevent, and it is invisible until a build runs on the missing arch.
          for a in amd64 arm64; do
            docker manifest inspect "$IMG:latest" \
              | jq -e --arg a "$a" '.manifests | map(.platform.architecture) | index($a)' >/dev/null \
              || { echo "::error::index does not carry $a"; exit 1; }
            echo "  index carries $a"
          done

          # release-verifiable.yml pins the INDEX digest, so each leg resolves
          # to its own architecture. A moving tag in the path that produces
          # signed artifacts would let the toolchain change under a release
          # with nothing recording it.
          # `docker manifest push` prints the index digest it just pushed.
          # Do NOT use `docker manifest inspect -v` for this: on a LIST it
          # returns an ARRAY of per-manifest objects, so `.Descriptor.digest`
          # errors with "Cannot index array with string" — and the per-manifest
          # digests are the wrong thing to pin anyway, since pinning one of
          # those is what pins a single architecture.
          DIGEST=$(docker manifest push "$IMG:latest" | tail -1)
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not read the index digest, got: $DIGEST"; exit 1 ;;
          esac
          echo "digest: $DIGEST"
          {
            echo "### Builder image published (amd64 + arm64)"
            echo ""
            echo 'Pin this in `release-verifiable.yml`:'
            echo ""
            echo '```'
            echo "image: $IMG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
