name: Release

on:
  workflow_dispatch:
  release:
    types: [created]

# Nothing at workflow level. Each job opens only the scopes it needs — the
# supply-chain jobs need id-token/attestations write, and a blanket grant here
# would hand those to every job in the file, including ones that only build.
permissions: {}

jobs:
  build-ui-tarballs:
    name: Build UI tarballs (cxb + catalog)
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Build UI frontends (cxb + catalog)
        run: ./build-ui.sh

      - name: Set version
        id: version
        run: |
          echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Package tarballs
        run: |
          mkdir -p dist/out
          V="${{ steps.version.outputs.version }}"
          # Flat-root archives — extract into a web docroot and the SPA runs.
          # Each bundle's own index.html / config.json / assets/ are at the top.
          tar -czf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client     .
          tar -czf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client .
          ls -lh dist/out/*.tar.gz

      - name: Sign and attest the UI bundles
        uses: ./.github/actions/sign-attest
        with:
          subjects: |
            dist/out/cxb-*.tar.gz
            dist/out/catalog-*.tar.gz
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload UI tarballs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/out/cxb-*.tar.gz dist/out/catalog-*.tar.gz --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tarballs
          path: dist/out/*.tar.gz

  sboms:
    name: CycloneDX SBOMs (one per target)
    # Hosted, and only one job for every target. A CycloneDX SBOM is a
    # restore-graph document: it depends on the tagged source and a .NET SDK,
    # not on the target's OS or CPU. Generating them all here keeps `dotnet`
    # off the self-hosted packaging runners — those build inside containers and
    # have no SDK of their own — while still producing the graph the packages
    # were actually built from, in this run, from this commit.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Single source of truth for "the SDK the lock files were written with".
      # Bumping dist/LOCKFILE_SDK and regenerating the lock files is one
      # deliberate change; nothing here has to be edited alongside it.
      - name: Resolve the lock-file SDK
        id: sdk
        run: echo "version=$(cat dist/LOCKFILE_SDK)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        env:
          # Install into an empty directory rather than the image's shared
          # /usr/share/dotnet. Asking for an exact dotnet-version only controls
          # what gets INSTALLED, not what gets SELECTED: global.json says
          # rollForward: latestFeature, so the muxer picks the highest feature
          # band present, and the runner image already ships its own .NET 10
          # SDK. Requesting 10.0.110 next to a preinstalled 10.0.4xx therefore
          # runs 10.0.4xx — and the graph would look like it had drifted. An
          # isolated root leaves exactly one SDK to select.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-lockfile-sdk
        with:
          # Exact, not 10.0.x: the SDK stamps its own ILCompiler/ILLink.Tasks
          # versions and content hashes into the recorded graph, so the drift
          # check is only meaningful on the version that wrote it.
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Recorded dependency graph matches a fresh restore
        run: ./dist/check-dependency-graph.sh

      # Node for dist/frontend-sbom.sh: the embedded cxb/catalog SPAs' npm trees
      # are resolved with npm; syft is installed by the script itself.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable Corepack (yarn for the frontend SBOM)
        run: corepack enable

      - name: Generate one SBOM per shipped runtime identifier
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          mkdir -p sboms
          # The embedded Svelte frontends are RID-independent, so build their
          # runtime-npm SBOM once and merge it into every per-RID document.
          ./dist/frontend-sbom.sh --version "$V" --out sboms/frontends.cdx.json
          for RID in linux-x64 linux-musl-x64 linux-musl-arm64 win-x64 osx-arm64; do
            ./dist/sbom.sh --rid "$RID" --version "$V" --out sboms \
              --frontend sboms/frontends.cdx.json
          done
          rm -f sboms/frontends.cdx.json   # intermediate, not a per-RID artifact
          ls -l sboms

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json
          if-no-files-found: error

  publish-nuget:
    name: Publish Dmart.Models + Dmart.QueryGrammar + Dmart.Client + Dmart.SqlAdapter to NuGet
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
      # No packages: write — the nuget.org push authenticates with
      # NUGET_API_KEY, not GITHUB_TOKEN.
    # Bubble the secret up to job-level env so the step-level `if:`
    # expression can read it (env.X is resolved at the step evaluator,
    # secrets.X is not).
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      # Pack the four NuGet-shippable SDKs. MSBuild resolves the
      # ProjectReferences so Dmart.Client.nupkg and Dmart.SqlAdapter.nupkg
      # correctly declare a PackageReference on Dmart.Models and
      # Dmart.QueryGrammar at the same version. Dmart.SqlAdapter is
      # excluded from the AOT server binary (see <Compile Remove="..."/>
      # in dmart.csproj) but is part of the public SDK surface and ships
      # on the same release cadence as the others.
      #
      # Dmart.QueryGrammar MUST be packed alongside SqlAdapter — SqlAdapter
      # carries a PackageReference dependency on it, and shipping SqlAdapter
      # without the matching QueryGrammar package would break installs at
      # the consumer end with NU1101 "unable to find package".
      - name: Pack Dmart.Models + Dmart.QueryGrammar + Dmart.Client + Dmart.SqlAdapter
        run: |
          V="${{ steps.version.outputs.version }}"
          dotnet pack Dmart.Models/Dmart.Models.csproj \
            -c Release -p:Version="$V" --nologo -o dist/out/nuget
          dotnet pack Dmart.QueryGrammar/Dmart.QueryGrammar.csproj \
            -c Release -p:Version="$V" --nologo -o dist/out/nuget
          dotnet pack dmart.Client/dmart.Client.csproj \
            -c Release -p:Version="$V" --nologo -o dist/out/nuget
          dotnet pack Dmart.SqlAdapter/Dmart.SqlAdapter.csproj \
            -c Release -p:Version="$V" --nologo -o dist/out/nuget
          ls -lh dist/out/nuget/

      - name: Sign and attest the NuGet packages
        uses: ./.github/actions/sign-attest
        with:
          subjects: |
            dist/out/nuget/*.nupkg
            dist/out/nuget/*.snupkg
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload .nupkg files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/out/nuget/*.nupkg dist/out/nuget/*.snupkg --clobber

      # Requires NUGET_API_KEY secret on the repo. `--skip-duplicate`
      # makes the push idempotent — re-running a release doesn't fail
      # if a package version was already published. If the secret isn't
      # configured the step no-ops cleanly so the rest of the workflow
      # (RPMs, container, tarballs) still succeeds.
      - name: Push to nuget.org
        if: github.event_name == 'release' && env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "dist/out/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: dist/out/nuget/*

  build-srpm:
    name: Build Source RPM
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Build SRPM
        run: |
          pkill -f 'dmart serve' 2>/dev/null || true
          sleep 1
          rm -rf bin obj dist/out
          VERSION="$(dist/release-version.sh)"
          VERSION="$VERSION" ./dist/build-rpm.sh srpm

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name '*.src.rpm' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/*.src.rpm — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-linux-x64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload SRPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRPM=$(ls dist/out/*.src.rpm 2>/dev/null | head -1)
          if [ -n "$SRPM" ]; then
            gh release upload "$GITHUB_REF_NAME" "$SRPM" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srpm
          path: dist/out/*.src.rpm

  build-fedora-rpm:
    name: Build Fedora RPM
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    # build-el9-rpm for the binary, not for the RPM: it performs the one
    # linux-x64 AOT compile this release does. See its upload step.
    needs: [build-ui-tarballs, sboms, build-el9-rpm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      # The one linux-x64 AOT compile of this release, from build-el9-rpm.
      # DMART_PREBUILT_BIN below makes the packaging script use it instead of
      # compiling its own copy of the same binary.
      - name: Download the shared linux-x64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-x64-bin
          path: prebuilt

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Build Fedora RPM
        run: |
          pkill -f 'dmart serve' 2>/dev/null || true
          sleep 1
          rm -rf bin obj dist/out
          VERSION="$(dist/release-version.sh)"
          VERSION="$VERSION" DMART_PREBUILT_BIN="$PWD/prebuilt" ./dist/build-rpm.sh

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name '*fc*.x86_64.rpm' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/*fc*.x86_64.rpm — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-linux-x64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload Fedora RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RPM=$(ls dist/out/*fc*.x86_64.rpm 2>/dev/null | head -1)
          if [ -n "$RPM" ]; then
            gh release upload "$GITHUB_REF_NAME" "$RPM" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-rpm
          path: dist/out/*.x86_64.rpm

  build-el9-rpm:
    name: Build RHEL 9 RPM
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      # Reclaim podman storage WITHOUT touching the dmart-el9-builder
      # container. build-rpm.sh keeps that container (with dotnet-sdk-10.0,
      # rpm-build, and clang pre-installed) around so subsequent runs just
      # `podman start` it instead of reinstalling the SDK — a 3-5 min save
      # per release. Pruning builder cache + dangling images is enough to
      # reclaim the space without breaking that reuse.
      - name: Reclaim podman storage
        run: |
          df -h ~ || true
          podman builder prune -af || true
          podman image prune -f || true
          df -h ~ || true

      - name: Build EL9 RPM via podman
        run: |
          pkill -f 'dmart serve' 2>/dev/null || true
          sleep 1
          rm -rf dist/out
          # Remove stale builder container from previous runs
          podman rm -f dmart-el9-builder 2>/dev/null || true
          VERSION="$(dist/release-version.sh)"
          VERSION="$VERSION" ./dist/build-rpm.sh el9

      # This job is now the single linux-x64 AOT compile for the whole
      # release. The Fedora RPM and the .deb used to run their own, three
      # compiles of the same target costing ~12 minutes of a three-runner pool
      # and giving three chances to quietly diverge.
      #
      # EL9 is the one to build on, not Fedora or Debian: AlmaLinux 9 is glibc
      # 2.34, the LOWEST floor of the three. That binary runs on Fedora and on
      # Debian 12 (2.36); neither of theirs would run here. So sharing this one
      # widens what the other two packages support rather than narrowing it.
      - name: Publish the linux-x64 binary for the other packaging jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-bin
          path: |
            bin/dmart
            bin/libe_sqlite3.so
          if-no-files-found: error
          retention-days: 1

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name '*el9*.x86_64.rpm' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/*el9*.x86_64.rpm — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-linux-x64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload EL9 RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RPM=$(ls dist/out/*el9*.x86_64.rpm 2>/dev/null | head -1)
          if [ -n "$RPM" ]; then
            gh release upload "$GITHUB_REF_NAME" "$RPM" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: el9-rpm
          path: dist/out/*.x86_64.rpm

  build-deb-amd64:
    name: Build Debian .deb (amd64)
    # Self-hosted runner is x86_64 Fedora; the .deb is built INSIDE
    # mcr.microsoft.com/dotnet/sdk:10.0 (Debian 12 bookworm base) via
    # podman, so the runner's distro doesn't matter. Same shape as
    # build-fedora-rpm / build-el9-rpm — container-built linux package.
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms, build-el9-rpm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      # The one linux-x64 AOT compile of this release, from build-el9-rpm.
      # DMART_PREBUILT_BIN below makes the packaging script use it instead of
      # compiling its own copy of the same binary.
      - name: Download the shared linux-x64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-x64-bin
          path: prebuilt

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Build .deb (debian:12-base via dotnet/sdk:10.0)
        run: |
          pkill -f 'dmart serve' 2>/dev/null || true
          sleep 1
          rm -rf dist/out/*.deb
          VERSION="$(dist/release-version.sh)"
          VERSION="$VERSION" DMART_PREBUILT_BIN="$PWD/prebuilt" ./dist/build-deb.sh

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name 'dmart_*_amd64.deb' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/dmart_*_amd64.deb — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-linux-x64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload .deb to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB=$(ls dist/out/dmart_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            gh release upload "$GITHUB_REF_NAME" "$DEB" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-deb-amd64
          path: dist/out/dmart_*_amd64.deb

  build-windows:
    name: Build Windows (win-x64 AOT)
    runs-on: windows-latest
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        shell: bash
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set version
        id: version
        shell: bash
        run: |
          echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish AOT win-x64
        shell: pwsh
        run: |
          # Mirror build.sh's format: "describe branch=X date=Y". --long
          # forces `git describe` to always emit "<tag>-<n>-g<sha>" — without
          # it, an exact-tag commit collapses to just the tag and the short
          # SHA goes missing. fetch-depth: 0 above guarantees tag history.
          $describe = (git describe --tags --always --long 2>$null).Trim()
          if (-not $describe) { $describe = "v${{ steps.version.outputs.version }}" }
          $date = (git show --pretty=format:%ad --date=short -q 2>$null).Trim()
          if (-not $date) { $date = Get-Date -Format yyyy-MM-dd }
          $info = "$describe branch=${env:GITHUB_REF_NAME} date=$date"
          dotnet publish dmart.csproj -r win-x64 -c Release `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -p:InformationalVersion="$info"

      - name: Prune dev-only artifacts + package zip
        shell: pwsh
        run: |
          $pub = "bin/Release/net10.0/win-x64/publish"
          Get-ChildItem $pub -File | Where-Object {
            $_.Name -match '\.pdb$|\.Development\.json$|\.deps\.json$|staticwebassets'
          } | Remove-Item -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist/out | Out-Null
          $zip = "dist/out/dmart-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "$pub/*" -DestinationPath $zip -Force
          Get-ChildItem $zip | Format-List FullName,Length

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name '*-win-x64.zip' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/*-win-x64.zip — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-win-x64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload Windows zip to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist/out/*-win-x64.zip | Select-Object -First 1 -ExpandProperty FullName
          if ($zip) { gh release upload "$env:GITHUB_REF_NAME" "$zip" --clobber }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip
          path: dist/out/*-win-x64.zip

  build-macos-arm64:
    name: Build macOS (osx-arm64 AOT)
    # macos-14 is the Apple Silicon (M1) GitHub-hosted runner image.
    # NativeAOT cannot cross-compile from Linux/Windows, so the only way
    # to produce an osx-arm64 native binary is to run the publish on an
    # arm64 macOS host. Public repos get macOS minutes for free; private
    # repos are billed at 10x the Linux rate, so think before flipping.
    runs-on: macos-14
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set version
        id: version
        run: |
          echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish AOT osx-arm64
        # build.sh's --rid flag drives the publish. UI dists are already
        # extracted above so build.sh's "needs_build" check skips the
        # yarn/npm path (the macos-14 runner does ship Node, but we don't
        # need it here — the dists came from the build-ui-tarballs job).
        run: ./build.sh --aot --rid osx-arm64

      - name: Ad-hoc codesign
        # Ad-hoc (-) signing satisfies macOS's cohesive-signature check
        # that an AOT-stripped Mach-O binary can fail post-publish.
        # Downloaders still need a one-time `xattr -d com.apple.quarantine`
        # to clear Gatekeeper after extracting the zip; full notarization
        # would require an Apple Developer ID cert + secrets wiring.
        run: |
          codesign --force --sign - bin/Release/net10.0/osx-arm64/publish/dmart
          codesign --verify --verbose bin/Release/net10.0/osx-arm64/publish/dmart

      - name: Package zip
        run: |
          mkdir -p dist/out
          ZIP="dist/out/dmart-${{ steps.version.outputs.version }}-osx-arm64.zip"
          # -j strips the bin/Release/net10.0/osx-arm64/publish prefix so
          # the archive extracts flat into wherever the user unzips it —
          # matches the layout of the win-x64 zip.
          (cd bin/Release/net10.0/osx-arm64/publish && zip -9 -r "$OLDPWD/$ZIP" .)
          ls -lh "$ZIP"

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name '*-osx-arm64.zip' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/*-osx-arm64.zip — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-osx-arm64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload macOS zip to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP=$(ls dist/out/*-osx-arm64.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-zip
          path: dist/out/*-osx-arm64.zip

  build-apk-x86_64:
    name: Build Alpine APK (x86_64)
    # Self-hosted runner is already x86_64; the Alpine container the
    # build script spins up will resolve to amd64 automatically, no
    # --platform flag, no QEMU. Same shape as fedora-rpm / el9-rpm.
    runs-on: self-hosted
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Build APK (x86_64)
        run: |
          pkill -f 'dmart serve' 2>/dev/null || true
          sleep 1
          rm -rf dist/out/*.apk
          VERSION="$(dist/release-version.sh)"
          VERSION="$VERSION" ./dist/build-apk.sh --arch x86_64

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name 'dmart-*-x86_64.apk' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/dmart-*-x86_64.apk — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-linux-musl-x64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls dist/out/dmart-*-x86_64.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-apk-x86_64
          path: dist/out/dmart-*-x86_64.apk

  build-apk-aarch64:
    name: Build Alpine APK (aarch64)
    # ubuntu-24.04-arm is a GitHub-hosted Apple-Silicon-equivalent
    # ARM64 Ubuntu runner (free on public repos). Same script as the
    # x86_64 job, different host arch — the Alpine container picks
    # the arm64 manifest variant automatically. No QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for cosign + attestations
      attestations: write   # store the attestation against this repo
    needs: [build-ui-tarballs, sboms]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download UI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-tarballs
          path: dist/out

      - name: Extract UI dists
        run: |
          V="$(dist/release-version.sh)"
          mkdir -p cxb/dist/client catalog/dist/client
          tar -xzf "dist/out/cxb-${V}.tar.gz"     -C cxb/dist/client
          tar -xzf "dist/out/catalog-${V}.tar.gz" -C catalog/dist/client

      - name: Build APK (aarch64)
        # ubuntu-24.04-arm ships docker (not podman). CONTAINER_ENGINE
        # toggles the script's `$ENGINE run` call without other changes.
        #
        # This is also why the job has no podman-preflight step, unlike its
        # five self-hosted siblings: no podman, and a hosted runner gets a
        # fresh VM per job so there is no per-boot state to go stale. If this
        # ever moves to a self-hosted runner, add the preflight — the action
        # no-ops on hosted runners, so adding it is never wrong.
        run: |
          VERSION="$(dist/release-version.sh)"
          CONTAINER_ENGINE=docker VERSION="$VERSION" \
            ./dist/build-apk.sh --arch aarch64

      - name: Fetch the SBOMs built from this tag
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sboms
          path: sboms

      # Named after the artifact it describes, so scripts/verify-release.sh can
      # pair the two without knowing anything about RIDs or packaging layouts.
      - name: Pair the SBOM with the artifact
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          V="$(dist/release-version.sh)"
          ART=$(find dist/out -maxdepth 1 -name 'dmart-*-aarch64.apk' 2>/dev/null | sort | head -1)
          if [ -z "$ART" ]; then
            echo "::error::no artifact matched dist/out/dmart-*-aarch64.apk — nothing to sign"
            exit 1
          fi
          cp "sboms/dmart-${V}-linux-musl-arm64.cdx.json" "${ART}.cdx.json"
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "sbom=${ART}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        uses: ./.github/actions/sign-attest
        with:
          subjects: ${{ steps.signing.outputs.artifact }}
          sbom: ${{ steps.signing.outputs.sbom }}
          github-token: ${{ github.token }}
          upload-to-release: ${{ github.event_name == 'release' }}
          tag: ${{ github.ref_name }}

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls dist/out/dmart-*-aarch64.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpine-apk-aarch64
          path: dist/out/dmart-*-aarch64.apk

  build-container:
    name: Build & Push Container Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write       # push to ghcr.io
    # The APK, not the UI tarballs: the image INSTALLS the Alpine package now
    # rather than compiling dmart a second time, and that package already
    # carries the SPAs. This serialises the two jobs where they used to run in
    # parallel, which is still the better trade — the container step drops from
    # a full musl AOT compile (~5 min) to an `apk add`, freeing a runner from a
    # pool of three for most of a wave.
    needs: build-apk-x86_64
    steps:
      # fetch-depth: 0 — need tag history so `git describe --tags` below
      # produces a proper version label for the image LABELs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      - name: Download the Alpine package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: alpine-apk-x86_64
          path: dist/out

      # Reclaim podman storage WITHOUT wiping base images or the long-lived
      # el9 builder container. `podman system prune -af` would also blow
      # away `mcr.microsoft.com/dotnet/sdk:10.0-alpine`, `alpine:edge`, and
      # the almalinux:9 layers that the dmart-el9-builder depends on —
      # forcing re-pulls and full SDK reinstalls on every release.
      #
      # We instead target just the real hogs:
      #   1. Build cache (podman builder prune) — where prior `podman build`
      #      intermediate layers pile up.
      #   2. Dangling images (no `-a`) — images with no tag, typically orphans.
      #   3. Old ghcr.io/edraj/csdmart:<version> tags, keeping :latest and
      #      the version we're about to push.
      - name: Reclaim podman storage
        run: |
          df -h ~ || true
          podman builder prune -af || true
          podman image prune -f || true
          # Delete superseded versioned images of this repo, keep :latest
          # and the incoming version. Safe because the push step tags both.
          KEEP_VER="$(dist/release-version.sh)"
          podman image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep '^ghcr.io/${{ github.repository }}:' \
            | grep -v ':latest$' \
            | grep -v ":${KEEP_VER}$" \
            | xargs -r -n1 podman rmi -f || true
          df -h ~ || true

      - name: Set version
        id: version
        run: |
          echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      # Publishing steps are gated on the release event. A workflow_dispatch
      # run is a test — and until now it pushed :latest anyway, which on a
      # branch ref means `VERSION` resolves to the branch NAME and every
      # `podman pull ghcr.io/edraj/csdmart:latest` downstream would silently
      # start serving a branch build. The build and the smoke test below still
      # run on a dispatch, so the coverage is unchanged; only publication stops.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'release'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build all-in-one container image
        run: |
          # No GIT_* build args any more. They existed so the compile stage
          # could bake InformationalVersion into the binary; the binary now
          # arrives prebuilt in the .apk with that already baked in, and
          # `dmart --version` reports it from there.
          # Arch-suffixed tag. The bare :<version> and :latest are a MANIFEST
          # LIST assembled by the container-manifest job once both arches have
          # pushed — tagging them here would make whichever arch finished last
          # the only one an `podman pull` ever sees.
          podman build \
            -t ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-amd64 \
            -f admin_scripts/docker/Dockerfile \
            --build-arg DMART_VERSION=${{ steps.version.outputs.version }} \
            --build-arg TARGETARCH_APK=x86_64 \
            .

      # The image is the package: prove the installed binary runs and serves
      # before pushing it. This used to be implicit in the build succeeding —
      # a compile that linked was some evidence. An `apk add` that succeeds is
      # not, so the check has to be explicit now.
      - name: Smoke the image before pushing
        run: |
          set -e
          IMG=ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-amd64
          podman run --rm "$IMG" dmart --version
          podman rm -f dmart-relsmoke 2>/dev/null || true
          RUNNER_DIGITS=$(printf '%s' "${RUNNER_NAME:-local}" | tr -cd '0-9' | tail -c 3)
          PORT=$(( 18100 + 10#${RUNNER_DIGITS:-0} % 50 ))
          podman run -d --name dmart-relsmoke -p "$PORT":8000 "$IMG"
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$PORT/health/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          podman logs dmart-relsmoke 2>&1 | tail -20
          [ "$ready" = "1" ] || {
            echo "image never became ready"
            podman rm -f dmart-relsmoke 2>/dev/null || true
            exit 1
          }

          # The SPAs are served from the binary's embedded resources. The APK's
          # on-disk copy at /usr/lib/dmart/{cxb,catalog} used to be a fallback
          # and is now removed from the image, so this is the only thing
          # standing between a broken embedded reader and a released container
          # that 404s both UIs — which is exactly what v1.5.0 and v1.5.1 did to
          # the static tarball, silently, for two releases.
          #
          # These run while the container is still UP. The teardown below used
          # to sit above the readiness assertion, so anything added after it
          # curled a container that no longer existed and failed with exit 7
          # (connection refused) rather than a status code.
          rc=0
          for path in /cxb/ /cat/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT$path" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  $path serves OK"
            else
              echo "$path returned $code, expected 200"
              podman logs dmart-relsmoke 2>&1 | tail -30
              rc=1
            fi
          done

          podman rm -f dmart-relsmoke 2>/dev/null || true
          [ "$rc" = "0" ] || exit 1
          echo "image serves on SQLite"

      - name: Push container image
        if: github.event_name == 'release'
        run: |
          podman push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-amd64

  # arm64 half of the image. Separate job rather than a --platform flag on the
  # one above: the Dockerfile's `apk add` has to EXECUTE aarch64 binaries, so
  # this needs a real arm64 machine. ubuntu-24.04-arm is the same runner the
  # aarch64 APK is built on — which is also why that APK existed but no arm64
  # image did.
  #
  # docker, not podman: ubuntu-24.04-arm is GitHub-hosted and ships docker.
  # Same reason build-apk-aarch64 sets CONTAINER_ENGINE=docker and skips the
  # podman-preflight its self-hosted siblings run.
  build-container-arm64:
    name: Build & Push Container Image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    needs: build-apk-aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download the Alpine package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: alpine-apk-aarch64
          path: dist/out

      - name: Set version
        id: version
        run: echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'release'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build all-in-one container image (arm64)
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-arm64 \
            -f admin_scripts/docker/Dockerfile \
            --build-arg DMART_VERSION=${{ steps.version.outputs.version }} \
            --build-arg TARGETARCH_APK=aarch64 \
            .

      - name: Smoke the image before pushing
        run: |
          set -e
          IMG=ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-arm64
          docker run --rm "$IMG" dmart --version
          docker rm -f dmart-relsmoke-arm 2>/dev/null || true
          docker run -d --name dmart-relsmoke-arm -p 18099:8000 "$IMG"
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:18099/health/ready" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "image never became ready"; docker logs dmart-relsmoke-arm | tail -30; exit 1; }
          # Same assertion as the amd64 job, and for the same reason: the SPAs
          # come only from the binary's embedded resources now, so nothing else
          # would notice an image that serves neither UI.
          # `|| echo 000` matters under set -e: a connection failure would
          # otherwise abort the assignment and exit 7 before the status check,
          # reporting a shell error instead of "this path did not serve".
          rc=0
          for path in /cxb/ /cat/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18099$path" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  $path serves OK"
            else
              echo "$path returned $code, expected 200"
              docker logs dmart-relsmoke-arm 2>&1 | tail -30
              rc=1
            fi
          done
          docker rm -f dmart-relsmoke-arm
          [ "$rc" = "0" ] || exit 1

      - name: Push container image (arm64)
        if: github.event_name == 'release'
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-arm64

  # The multi-arch manifest. Until this runs, ghcr carries only the two
  # arch-suffixed tags and `podman pull ghcr.io/edraj/csdmart` resolves to
  # nothing — so this job is what actually publishes the image.
  container-manifest:
    name: Container manifest (multi-arch)
    runs-on: self-hosted
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    needs:
      - build-container
      - build-container-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Podman preflight (self-heal stale state after host reboot)
        uses: ./.github/actions/podman-preflight

      - name: Set version
        id: version
        run: echo "version=$(dist/release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble and push the manifest list
        run: |
          set -euo pipefail
          REPO=ghcr.io/${{ github.repository }}
          V=${{ steps.version.outputs.version }}
          for tag in "$V" latest; do
            podman manifest rm "$REPO:$tag" 2>/dev/null || true
            podman manifest create "$REPO:$tag"
            podman manifest add "$REPO:$tag" "docker://$REPO:$V-amd64"
            podman manifest add "$REPO:$tag" "docker://$REPO:$V-arm64"
            podman manifest push --all "$REPO:$tag" "docker://$REPO:$tag"
          done

      - name: Verify both architectures resolve
        run: |
          set -euo pipefail
          REPO=ghcr.io/${{ github.repository }}
          V=${{ steps.version.outputs.version }}
          # An index that lists one arch, or lists an arch whose manifest was
          # never pushed, still "succeeds" above. Ask the registry what it
          # actually has.
          for arch in amd64 arm64; do
            podman manifest inspect "docker://$REPO:$V" \
              | jq -e --arg a "$arch" '.manifests | map(.platform.architecture) | index($a)' >/dev/null \
              || { echo "::error::$REPO:$V does not carry $arch"; exit 1; }
            echo "  $V carries $arch"
          done

      - name: Print image info
        run: |
          echo "Pushed:"
          echo "  ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}  (amd64 + arm64)"
          echo "  ghcr.io/${{ github.repository }}:latest"
          echo ""
          echo "Run with:"
          echo "  podman run --name dmart -p 8000:8000 -d -it ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"

  checksums:
    name: SHA256SUMS-all (signed)
    # Runs last and reads the release itself rather than this workflow's
    # artifacts, so the manifest describes what an operator will actually
    # download — including the linux tarballs and signature material that
    # release-verifiable.yml attached at tag time.
    needs:
      - build-ui-tarballs
      - publish-nuget
      - build-srpm
      - build-fedora-rpm
      - build-el9-rpm
      - build-deb-amd64
      - build-windows
      - build-macos-arm64
      - build-apk-x86_64
      - build-apk-aarch64
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v2, deliberately — cosign v3 keyless cannot emit a detached
          # signature. See .github/actions/sign-attest/action.yml.
          cosign-release: 'v2.6.1'

      - name: Download every asset on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh has no repo to infer from and
          # `gh release download` dies with "fatal: not a git repository".
          # GH_REPO tells it which repo to talk to without a working tree.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" --dir assets --clobber
          ls -l assets

      - name: SHA256SUMS-all
        working-directory: assets
        run: |
          set -euo pipefail
          # Excludes the manifests themselves; a manifest cannot list its own
          # digest, and SHA256SUMS (from release-verifiable.yml) is listed here
          # so the two manifests cross-cover each other.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-all*' -printf '%P\n' \
            | sort | xargs sha256sum > SHA256SUMS-all
          wc -l < SHA256SUMS-all

      - name: Sign SHA256SUMS-all (keyless, GitHub OIDC)
        working-directory: assets
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --new-bundle-format=false \
            --output-signature SHA256SUMS-all.sig \
            --output-certificate SHA256SUMS-all.pem \
            SHA256SUMS-all
          test -s SHA256SUMS-all.sig && test -s SHA256SUMS-all.pem

      - name: Attach the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reason as the download step: this job has no checkout and the
          # upload runs from working-directory `assets`, so gh has no repo to
          # infer and `gh release upload` dies with "fatal: not a git
          # repository". GH_REPO points it at the repo without a working tree.
          GH_REPO: ${{ github.repository }}
        working-directory: assets
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            SHA256SUMS-all SHA256SUMS-all.sig SHA256SUMS-all.pem --clobber
