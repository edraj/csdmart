name: Sign and attest release artifacts
description: >
  Keyless cosign signature (GitHub OIDC, recorded in Rekor) plus SLSA build
  provenance — and optionally an SBOM attestation — for artifacts produced by
  the job that calls this action.

# Deliberately called from inside each BUILDING job rather than from one
# central signing job at the end of the workflow.
#
# actions/attest-build-provenance describes the environment it runs in, not
# the environment a file was produced in. Called from a central job on a
# hosted runner, it would stamp `runner_environment: github-hosted` onto RPMs
# that were in fact compiled on a self-hosted machine — a provenance document
# that is precisely wrong about the one fact a downstream reviewer is reading
# it for. Called here, the self-hosted jobs say self-hosted and the hosted
# jobs say hosted, and docs/VERIFYING-RELEASES.md tells operators how to read
# the difference.
#
# The caller must grant, at JOB level:
#   id-token: write        (OIDC token for cosign + attestation)
#   attestations: write    (store the attestation against the repo)
#   contents: write        (only when upload-to-release is true)

inputs:
  subjects:
    description: >
      Newline-separated paths or globs of the files to sign and attest. Every
      pattern must match at least one file.
    required: true
  sbom:
    description: >
      Optional path to a CycloneDX SBOM describing the subjects. When set, an
      SBOM attestation is produced in addition to the provenance.
    required: false
    default: ''
  upload-to-release:
    description: Upload the .sig/.pem (and the SBOM) to the release named by `tag`.
    required: false
    default: 'false'
  tag:
    description: Release tag to upload to. Required when upload-to-release is true.
    required: false
    default: ''
  github-token:
    description: Token used for the attestation API and the release upload.
    required: true

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Resolve subjects
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        # RUNNER_TEMP is a backslash path on Windows runners; git-bash handles
        # that unevenly, so normalise it before building paths from it.
        TMPD="${RUNNER_TEMP//\\//}"
        SUBJECTS="$TMPD/sign-attest-subjects"
        SIGNLIST="$TMPD/sign-attest-signlist"
        : > "$SUBJECTS"
        while IFS= read -r pattern; do
          pattern="$(echo "$pattern" | tr -d '\r')"
          [ -n "$pattern" ] || continue
          # shellcheck disable=SC2086 # deliberate glob expansion
          matches=$(ls -1 $pattern 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "::error::sign-attest: pattern '$pattern' matched no files — refusing to sign nothing"
            exit 1
          fi
          printf '%s\n' "$matches" >> "$SUBJECTS"
        done <<< "${{ inputs.subjects }}"
        sort -u -o "$SUBJECTS" "$SUBJECTS"

        # The SBOM is signed alongside its subject but is NOT itself an
        # attestation subject: it is the predicate of the SBOM attestation, and
        # attesting a document to itself would be circular. Signing it anyway
        # matters because scripts/verify-release.sh treats any unsigned asset
        # on a release as a failure — no exceptions, no "this one is only
        # metadata" carve-outs to reason about later.
        cp "$SUBJECTS" "$SIGNLIST"
        if [ -n "${{ inputs.sbom }}" ]; then
          test -f "${{ inputs.sbom }}" || {
            echo "::error::sign-attest: sbom '${{ inputs.sbom }}' does not exist"; exit 1; }
          echo "${{ inputs.sbom }}" >> "$SIGNLIST"
        fi

        echo "attestation subjects:"; sed 's/^/  /' "$SUBJECTS"
        echo "signing:";             sed 's/^/  /' "$SIGNLIST"
        {
          echo 'list<<SUBJECTS_EOF'
          cat "$SUBJECTS"
          echo 'SUBJECTS_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: cosign sign-blob (keyless, GitHub OIDC, logged in Rekor)
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "### cosign signatures"
          echo
          echo "| artifact | rekor log index |"
          echo "|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        while IFS= read -r f; do
          echo "== signing $f"
          # --yes: no interactive confirmation of the transparency-log upload.
          # There is no key here at all: cosign exchanges the job's OIDC token
          # for a short-lived Fulcio certificate, signs, and the certificate
          # plus signature go into Rekor. The certificate's SAN records the
          # workflow ref, which is what verification pins against.
          cosign sign-blob --yes \
            --output-signature "$f.sig" \
            --output-certificate "$f.pem" \
            "$f" 2>&1 | tee /tmp/cosign-out
          test -s "$f.sig" || { echo "::error::empty signature for $f"; exit 1; }
          test -s "$f.pem" || { echo "::error::empty certificate for $f"; exit 1; }
          idx=$(grep -oE 'index: [0-9]+' /tmp/cosign-out | head -1 | awk '{print $2}')
          echo "| \`$(basename "$f")\` | ${idx:-n/a} |" >> "$GITHUB_STEP_SUMMARY"
        done < "${RUNNER_TEMP//\\//}/sign-attest-signlist"

    - name: SLSA build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.resolve.outputs.list }}
        github-token: ${{ inputs.github-token }}

    - name: SBOM attestation
      if: inputs.sbom != ''
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: ${{ steps.resolve.outputs.list }}
        sbom-path: ${{ inputs.sbom }}
        github-token: ${{ inputs.github-token }}

    - name: Upload signature material to the release
      if: inputs.upload-to-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if [ -z "$TAG" ]; then
          echo "::error::upload-to-release is true but no tag was given"
          exit 1
        fi
        FILES=()
        while IFS= read -r f; do
          FILES+=("$f" "$f.sig" "$f.pem")
        done < "${RUNNER_TEMP//\\//}/sign-attest-signlist"
        # The subjects themselves are uploaded by the calling job's own upload
        # step; --clobber makes re-uploading them here harmless and means the
        # signature material can never be published without its artifact.
        gh release upload "$TAG" "${FILES[@]}" --clobber
